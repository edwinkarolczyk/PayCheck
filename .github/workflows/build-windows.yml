name: Build PayCheck Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyinstaller

      - name: Run tests
        run: pytest -q

      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name PayCheck app_320.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PayCheck-Windows
          path: dist/PayCheck.exe
